<style>
  :root{
    --bg:#0A0A0B;
    --surface:#141416;
    --surface-2:#1B1B1E;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.18);
    --text:#F2F2F2;
    --muted:#8E8E93;
    --muted-2:#5F5F63;
    --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 78%);
  }

  /* nav */
  .nav{position:sticky;top:0;z-index:10;background:rgba(10,10,11,.72);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1120px;margin:0 auto;padding:0 20px}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.1em}
  .brand img{width:22px;height:22px;flex:0 0 auto;border-radius:6px;display:block}
  .nav-links{display:none;gap:24px;font-size:13px;color:var(--muted)}
  .nav-links a{color:inherit;text-decoration:none;transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-btn{
    font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;background:transparent;
    border:1px solid var(--line-strong);border-radius:8px;padding:8px 14px;transition:.2s;
  }
  .nav-btn:hover{background:rgba(255,255,255,.07)}

  /* hero */
  .hero{position:relative;z-index:1;display:grid;gap:48px;padding:72px 0 40px}
  h1{font-size:clamp(38px,9.6vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:700}
  h1 span{display:block;color:var(--muted-2)}
  .hero p{margin-top:20px;max-width:26em;color:var(--muted);font-size:15px;line-height:1.7}
  .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;
    min-height:46px;padding:0 18px;border-radius:9px;border:1px solid transparent;
    transition:background .18s,border-color .18s,transform .18s;
  }
  .btn:active{transform:translateY(1px)}
  .btn svg{width:17px;height:17px;flex:0 0 auto;stroke-linecap:round;stroke-linejoin:round}
  .btn-solid{background:var(--text);color:#0A0A0B}
  .btn-solid:hover{background:#fff}
  .btn-line{background:transparent;color:var(--text);border-color:var(--line-strong)}
  .btn-line:hover{background:rgba(255,255,255,.06)}

  /* 3D 手机 */
  .stage{position:relative;display:grid;place-items:center;min-height:400px;perspective:1100px}
  .device{
    position:relative;width:min(60vw,260px);height:min(108vw,524px);
    transform-style:preserve-3d;
    transform:rotateY(-18deg) rotateX(6deg) rotateZ(-2deg);
    animation:float 8s ease-in-out infinite alternate;
  }
  @keyframes float{
    from{transform:rotateY(-18deg) rotateX(6deg) rotateZ(-2deg) translate3d(0,6px,0)}
    to{transform:rotateY(-13deg) rotateX(4deg) rotateZ(-1deg) translate3d(0,-8px,0)}
  }
  .case{
    position:absolute;inset:0;border-radius:46px;
    background:linear-gradient(155deg,#3A3A3D,#1A1A1D 48%,#2E2E31);
    box-shadow:0 36px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .screen{
    position:absolute;inset:8px;border-radius:39px;overflow:hidden;
    background:#0B0B0D;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);
    display:flex;flex-direction:column;
  }
  .notch{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:80px;height:22px;border-radius:12px;background:#050506;z-index:2}
  .bar{display:flex;justify-content:space-between;padding:13px 19px 4px;font-size:9.5px;color:var(--muted-2);letter-spacing:.08em}
  .chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:4px 13px 22px}
  .row{display:flex;gap:6px;align-items:flex-end;max-width:90%}
  .row.l{align-self:flex-start}
  .row.r{align-self:flex-end;flex-direction:row-reverse}
  .av{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:1px solid var(--line-strong)}
  .av.a{background:#3A3A3D}
  .av.b{background:#5A5A5E}
  .bub{padding:7px 10px;border-radius:13px;font-size:11.5px;line-height:1.5}
  .row.l .bub{background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px}
  .row.r .bub{background:var(--text);color:#0A0A0B;border-bottom-right-radius:4px;font-weight:500}
  .home{width:96px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.26);margin:0 auto 7px}

  /* section */
  .sec{position:relative;z-index:1;padding:56px 0 8px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  h2{font-size:clamp(19px,3.6vw,24px);font-weight:600;letter-spacing:-.015em}
  .count{font-size:12.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}

  .rail{
    display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:10px;
    overflow-x:auto;padding:18px 0 16px;scroll-snap-type:x mandatory;
  }
  .rail::-webkit-scrollbar{height:5px}
  .rail::-webkit-scrollbar-track{background:transparent}
  .rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .card{
    scroll-snap-align:start;border:1px solid var(--line);border-radius:11px;background:var(--surface);
    padding:12px;transition:border-color .2s,background .2s;
  }
  .card:hover{border-color:var(--line-strong);background:#17171A}
  .thumb{
    height:52px;border-radius:7px;background:#0E0E10;margin-bottom:10px;
    display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 9px;overflow:hidden;
  }
  .thumb i{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
  .card:nth-child(3n+1) .thumb i:nth-child(1){width:70%;opacity:.35}
  .card:nth-child(3n+1) .thumb i:nth-child(2){width:92%;opacity:.95}
  .card:nth-child(3n+2) .thumb i:nth-child(1){width:86%;opacity:.95}
  .card:nth-child(3n+2) .thumb i:nth-child(2){width:54%;opacity:.3}
  .card:nth-child(3n) .thumb i:nth-child(1){width:52%;opacity:.28}
  .card:nth-child(3n) .thumb i:nth-child(2){width:100%;opacity:.9}
  .thumb i:nth-child(3){width:38%;opacity:.2}
  .cname{font-size:12.5px;font-weight:500;white-space:nowrap}
  .cen{font-size:10px;color:var(--muted-2);letter-spacing:.09em;margin-top:2px;text-transform:uppercase}

  /* download */
  .dl{display:grid;gap:10px;margin-top:20px}
  .dl-card{
    border:1px solid var(--line);border-radius:13px;background:var(--surface);
    padding:20px;display:flex;flex-direction:column;gap:14px;
  }
  .dl-top{display:flex;align-items:center;gap:10px}
  .dl-top svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--text);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dl-top b{font-size:14.5px;font-weight:600}
  .dl-top span{margin-left:auto;font-size:11.5px;color:var(--muted-2)}
  .dl-card .btn{width:100%}

  footer{position:relative;z-index:1;margin-top:64px;border-top:1px solid var(--line);padding:22px 0 40px}
  .foot{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted-2)}
  .foot b{color:var(--muted);font-weight:500}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
    background:#1B1B1E;border:1px solid var(--line-strong);color:var(--text);
    font-size:12.5px;padding:10px 16px;border-radius:8px;max-width:min(88vw,400px);
    text-align:center;opacity:0;pointer-events:none;transition:.22s;z-index:50;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    .device{animation:none}
    html{scroll-behavior:auto}
  }

  @media (min-width:820px){
    .hero{grid-template-columns:1fr .86fr;align-items:center;gap:40px;padding:86px 0 56px}
    .stage{min-height:540px}
    .device{width:288px;height:596px}
    .nav-links{display:flex}
    h1{font-size:clamp(54px,5.2vw,76px)}
    .dl{grid-template-columns:1fr 1fr}
    .rail{grid-auto-columns:minmax(178px,1fr)}
    .foot{flex-direction:row;justify-content:space-between;align-items:center}
  }
</style>
</head>
